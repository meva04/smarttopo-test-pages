<!-- 단독으로 열어볼 때만 쓰는 스타일입니다. 사이트에는 아래 <div id="st26m"> 블록만 넣으면 됩니다. -->
<style>body{margin:0;background:#003054}</style>
</head>
<body>
  

<!-- ===== SmartTopo 메인 section01 시작 (사이트에 넣을 부분) =====
     메인 페이지의 <div class="target" id="section01"> 안쪽 내용(.inner_wrap)을 이 블록으로 바꿔 넣습니다.
     id="section01" 은 그대로 두어야 왼쪽 섹션 내비게이션이 동작합니다. -->
<div id="st26m">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap">
<style>
/* SmartTopo 메인 section01 — 이 <div id="st26m"> 블록 하나가 섹션 전체입니다(폰트·CSS·마크업·스크립트).
   CSS는 모두 #st26m#st26m 안에 중첩되어 있어 사이트 CSS의 영향을 받지 않고, 사이트에도 영향을 주지 않습니다. */
@keyframes st26m-ld{from{opacity:0;transform:translateY(18px)}}
@keyframes st26m-up{from{transform:translateY(105%)}}
@keyframes st26m-rise{from{opacity:0;transform:translateY(60px) rotate(4deg) scale(.94)}}
@keyframes st26m-pop{from{opacity:0;transform:translateY(14px) scale(.9)}}
@keyframes st26m-tap{from{transform:scale(.35);opacity:1}to{transform:scale(1.9);opacity:0}}
@keyframes st26m-tapdot{0%{transform:scale(.5);opacity:0}15%{transform:scale(1);opacity:1}65%{transform:scale(.92);opacity:1}100%{transform:scale(.8);opacity:0}}
/* 사이트의 기존 section01 배경 이미지·고정 높이·여백을 이 블록이 있을 때만 해제 */
#main.main2022 #section01:has(#st26m){background:none;height:auto;padding:0}
#st26m#st26m{
  --navy:#003054;--blue:#019aeb;--blue-ink:#0063a3;--amber:#e49325;
  --ink:#16222d;--ink-2:#56636f;--line:#dde1ea;--sub:#b9cbdb;
  --f-body:"Asta Sans","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --head:131px;   /* 사이트 헤더(투명, 섹션 위에 겹침) 높이 */
  position:relative;isolation:isolate;overflow:hidden;background:var(--navy);color:#fff;
  font-family:var(--f-body);font-size:18px;line-height:1.65;letter-spacing:normal;text-align:left;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;

  /* host-site reset: the site sets font, line-height and letter-spacing on every element (*{}) */
  & *,& *::before,& *::after{box-sizing:border-box;font-family:inherit;line-height:inherit;letter-spacing:inherit}
  & h1,& h2{color:inherit;padding:0;margin:0;text-wrap:balance}
  & h1::after,& h2::after{content:none}
  & p{margin:0;font-size:18px;font-weight:500}
  & a{color:inherit;text-decoration:none}
  & img,& video{display:block;max-width:100%}
  :focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}

  /* background: blue glow + live survey map */
  &::before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;
    background:radial-gradient(55% 65% at 76% 52%,rgba(1,154,235,.30),transparent 70%),radial-gradient(45% 55% at 0% 100%,rgba(228,147,37,.10),transparent 70%)}
  & canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}

  .wrap{max-width:1200px;margin-inline:auto;padding:calc(var(--head) + 64px) 20px 96px;min-height:807px;
    display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
  .new{display:inline-flex;align-items:center;gap:12px;padding:6px 18px 6px 6px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);font-size:18px;font-weight:600;line-height:1.2;transition:background .25s,border-color .25s}
  .new b{background:var(--amber);color:#fff;font-size:18px;font-weight:800;line-height:1;padding:7px 12px;border-radius:999px}
  .new svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--ease)}
  .new:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35)}
  .new:hover svg{transform:translateX(4px)}
  .logo{height:clamp(30px,3vw,40px);width:auto;margin:40px 0 0 4px}
  h1{font-size:clamp(36px,4vw,60px);font-weight:800;letter-spacing:-.035em;line-height:1.15;margin-top:22px}
  h1 .k{display:block;overflow:hidden}
  h1 .k>span{display:inline-block}
  h1 em{font-style:normal;color:var(--amber)}
  .lead{margin-top:24px;color:var(--sub);max-width:29em}
  .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px}
  .btn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;font:600 18px/1 var(--f-body);padding:15px 24px;border-radius:999px;transition:transform .35s var(--ease),background .2s,border-color .2s}
  .btn svg{width:18px;height:18px}
  .btn-blue{background:var(--blue);color:#fff;box-shadow:0 10px 24px -12px rgba(1,154,235,.8)}
  .btn-blue:hover{background:#0b8fd6}
  .btn-line{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.35)}
  .btn-line:hover{background:rgba(255,255,255,.14);border-color:#fff}
  .btn-line svg{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* phone stage */
  .stage{position:relative;justify-self:center;width:min(310px,72vw)}
  .phone{position:relative;width:100%;container-type:inline-size}
  .phone .shell{--k:calc(100cqw / 330);position:relative;padding:calc(10 * var(--k));border-radius:calc(30 * var(--k));background:#08090b;
    box-shadow:inset 0 0 0 calc(1 * var(--k)) #24272b,0 0 0 calc(1.5 * var(--k)) #a9aeb5,0 0 0 calc(4.5 * var(--k)) #5d6168,0 0 0 calc(6 * var(--k)) #33363b,0 0 0 calc(7 * var(--k)) #9ba0a7,
    0 calc(46 * var(--k)) calc(80 * var(--k)) calc(-30 * var(--k)) rgba(0,0,0,.65)}
  .phone .shell::before,.phone .shell::after{content:"";position:absolute;width:calc(4 * var(--k));background:#6b7077;border:calc(1 * var(--k)) solid #4a4e54}
  .phone .shell::before{left:calc(-11 * var(--k));top:17%;height:calc(46 * var(--k));border-radius:calc(3 * var(--k)) 0 0 calc(3 * var(--k));box-shadow:0 calc(64 * var(--k)) 0 calc(-1 * var(--k)) #6b7077,0 calc(-54 * var(--k)) 0 calc(-9 * var(--k)) #6b7077}
  .phone .shell::after{right:calc(-11 * var(--k));top:24%;height:calc(78 * var(--k));border-radius:0 calc(3 * var(--k)) calc(3 * var(--k)) 0}
  .phone .screen{position:relative;width:100%;border-radius:calc(20 * var(--k));overflow:hidden;background:var(--navy);display:flex;flex-direction:column;isolation:isolate}
  .phone .sbar{flex:none;height:calc(38 * var(--k));display:flex;align-items:flex-end;justify-content:space-between;padding:0 calc(18 * var(--k)) calc(7 * var(--k));background:var(--navy);color:#fff;font:600 calc(13 * var(--k))/1 var(--f-body);font-variant-numeric:tabular-nums}
  .phone .sbar .ic{display:flex;align-items:center;gap:calc(5 * var(--k))}
  .phone .sbar svg{display:block;height:calc(13 * var(--k));width:auto;fill:#fff}
  .phone .sbar .bt{font-size:calc(11.5 * var(--k));margin-left:calc(1 * var(--k))}
  .phone .foot{flex:none;height:calc(26 * var(--k));background:#fff}
  .phone .media{position:relative;flex:none;width:100%;aspect-ratio:400/766;overflow:hidden;background:#f1f1f6}
  .phone .media>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
  /* 영상 속 버튼을 누르는 순간 터치 효과 (휴대폰 틀 위에 띄움, 목업 밖으로 나가도 됨) */
  .phone>.tapfx{position:absolute;z-index:6;width:80px;height:80px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
  .tapfx::before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(1,154,235,.28);border:3px solid rgba(1,154,235,.9);animation:st26m-tap .75s ease-out forwards}
  .tapfx::after{content:"";position:absolute;inset:36%;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 0 4px rgba(1,154,235,.9),0 4px 10px rgba(0,48,84,.35);animation:st26m-tapdot .75s ease-out forwards}
  /* live readouts (part of the illustration) */
  .readout{position:absolute;z-index:3;background:#fff;border-radius:14px;padding:12px 14px;font-size:12.5px;color:var(--navy);font-weight:500;box-shadow:0 22px 40px -18px rgba(0,0,0,.55);white-space:nowrap;font-variant-numeric:tabular-nums;transition:transform .6s var(--ease)}
  .readout .lbl{color:var(--ink-2);font-size:10.5px;letter-spacing:.12em;display:block;margin-bottom:6px}
  .readout .row{display:flex;justify-content:space-between;gap:16px}
  .readout.r1{left:-188px;top:80px}   /* 휴대폰과 약 8px 간격 */
  .readout.r2{right:-112px;top:290px;display:flex;gap:6px;padding:8px}
  .readout.r3{left:-135px;bottom:70px}
  .readout .ok{color:var(--blue)}
  /* 소개 페이지와 같은 카드 구성(Figma 82:125104 · 69:116319 · 69:116344), 남색 배경 위라 카드는 밝은 색 */
  .readout.r1,.readout.r3{border-radius:16px;padding:16px 18px;display:grid;line-height:1;box-shadow:0 22px 40px -18px rgba(0,0,0,.55)}
  .readout.r1{gap:7px;font:700 17px/1 var(--f-body);color:var(--navy)}
  .readout.r1 .row,.readout.r3 .row{justify-content:flex-start;align-items:center;font-size:inherit;line-height:1}   /* 사이트 CSS가 div를 13px로 고정해서 상속으로 되돌림 */
  .readout.r1 .row{gap:8px}
  .readout.r1 .row>span:first-child{width:40px;flex:none}
  .readout.r2{padding:8px;border-radius:22px}
  .readout.r3{gap:9px;font:600 16px/1 var(--f-body);color:var(--ink-2)}
  .readout.r3 .row{gap:6px}
  .readout.r3 .ck{display:block;width:18px;height:18px;flex:none}
  .readout.r3 .ok{color:var(--navy);margin-left:-2px}
  .pill{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:42px;padding:8px 6px;border-radius:16px;font:700 10px/1 var(--f-body);color:rgba(241,241,246,.7);white-space:nowrap;text-align:center}
  .pill b{font-size:14px;line-height:1;color:#fff;font-weight:700}
  .pill.a{background:var(--amber)}
  .pill.b{background:var(--blue)}

  @media (max-width:960px){
    .wrap{grid-template-columns:1fr;gap:64px;padding-top:calc(var(--head) + 40px);min-height:0}
    .wrap>div:first-child{text-align:center}   /* 한 줄로 쌓이는 화면에서는 글·버튼 가운데 정렬 */
    .logo{display:block;margin-inline:auto}
    .lead{margin-inline:auto}
    .ctas{justify-content:center}
    .readout.r1{left:-14px;top:40px}.readout.r2{right:-14px;top:auto;bottom:150px}.readout.r3{left:-14px;bottom:24px}
  }
  @media (max-width:420px){.readout{font-size:11px}.readout.r1,.readout.r3{font-size:13px;padding:12px 14px;border-radius:12px;gap:5px}.readout.r1 .row>span:first-child{width:32px}.readout.r3 .ck{width:15px;height:15px}}
  /* reticle: crosshair + live coordinates under the pointer (same as the intro page hero) */
  .reticle{position:absolute;pointer-events:none;z-index:1;inset:0;opacity:0;transition:opacity .3s}
  &:hover .reticle{opacity:1}
  .reticle i{position:absolute;background:rgba(1,154,235,.35)}
  .reticle .h{left:0;right:0;height:1px}
  .reticle .v{top:0;bottom:0;width:1px}
  .reticle .tag{position:absolute;font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;color:#fff;padding:4px 8px;background:rgba(0,36,63,.85);border:1px solid rgba(255,255,255,.22);border-radius:6px;transform:translate(12px,12px);white-space:nowrap}
  @media (hover:none){.reticle{display:none}}

  /* motion */
  @media (prefers-reduced-motion:no-preference){
    .ld{animation:st26m-ld 1s var(--ease) both;animation-delay:calc(var(--d,0) * 90ms + 150ms)}
    h1 .k>span{animation:st26m-up 1s var(--ease) both;animation-delay:calc(var(--d,0) * 110ms + 100ms)}
    .stage .phone{animation:st26m-rise 1.3s var(--ease) both .35s}
    .readout{animation:st26m-pop .9s var(--ease) both;animation-delay:calc(var(--d,0) * 160ms + 900ms)}
  }
}
</style>

<script>
(()=>{
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const R=document.getElementById('st26m'),$=s=>R.querySelector(s);

/* device chrome: Android status bar + media area + bottom strip */
/* 목업 상태바 시간: 보는 사람의 현재 시각(안드로이드처럼 24시간, 예 9:05·15:30), 10초마다 갱신 */
const hm=()=>{const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
setInterval(()=>{const t=hm();R.querySelectorAll('.sbar .tm').forEach(e=>{if(e.textContent!==t)e.textContent=t})},10000);
const SB='<div class="sbar" aria-hidden="true"><span class="tm">'+hm()+'</span><span class="ic">'+
 '<svg viewBox="0 0 18 14"><path d="M9 13.5 0 4.2A13 13 0 0 1 18 4.2z" opacity=".95"/></svg>'+
 '<svg viewBox="0 0 16 14"><path d="M0 14h3v-3H0zm4.3 0h3V8h-3zm4.4 0h3V4.5h-3zM13 14h3V0h-3z"/></svg>'+
 '<svg viewBox="0 0 27 14"><rect x=".75" y=".75" width="22.5" height="12.5" rx="3.5" fill="none" stroke="#fff" stroke-width="1.5" opacity=".6"/><rect x="2.6" y="2.6" width="17.9" height="8.8" rx="2"/><path d="M24.8 4.8h.8a1.2 1.2 0 0 1 1.2 1.2v2a1.2 1.2 0 0 1-1.2 1.2h-.8z" opacity=".6"/></svg>'+
 '<span class="bt">94</span></span></div>';
R.querySelectorAll('.phone .screen').forEach(scr=>{
  const m=document.createElement('div');m.className='media';
  const ph=scr.parentElement,sh=document.createElement('div');sh.className='shell';ph.insertBefore(sh,scr);sh.appendChild(scr);
  while(scr.firstChild)m.appendChild(scr.firstChild);scr.insertAdjacentHTML('afterbegin',SB);scr.appendChild(m);
  scr.insertAdjacentHTML('beforeend','<div class="foot" aria-hidden="true"></div>');
});
R.querySelectorAll('video[autoplay]').forEach(v=>{v.muted=true;v.play().catch(()=>{})});

/* 터치 효과: 빠른 측설(0s) → 사진 측량(6.57s) → 측량 단계 간소화(32.4s) 이어 붙인 영상에서 버튼을 누르는 순간 [초, 가로%, 세로%] */
const TAPS=[[6.82,84,92],[15.4,42.5,26],[18.48,40,25.8],[19.57,65.7,28],[24.41,38,25.3],[28.98,88.7,24.8],[30.26,67.5,95],[33.37,85,83.4]];
function tapAt(v,x,y){const ph=v.closest('.phone');if(!ph)return;const a=v.getBoundingClientRect(),b=ph.getBoundingClientRect(),k=ph.offsetWidth/b.width||1;
  const d=document.createElement('span');d.className='tapfx';d.style.left=((a.left-b.left)+a.width*x/100)*k+'px';d.style.top=((a.top-b.top)+a.width*766/400*y/100)*k+'px';ph.appendChild(d);setTimeout(()=>d.remove(),800)}
if(!RM) R.querySelectorAll('.stage video').forEach(v=>{
  let last=0,run=false;
  const tick=()=>{if(v.paused||v.ended){run=false;return}
    const ct=v.currentTime;if(ct<last)last=-1;   // 반복 재생으로 처음으로 돌아감
    TAPS.forEach(([t,x,y])=>{if(t>last&&t<=ct&&ct-t<.4)tapAt(v,x,y)});
    last=ct;requestAnimationFrame(tick)};
  const go=()=>{if(!run){last=v.currentTime;run=true;requestAnimationFrame(tick)}};
  v.addEventListener('playing',go);if(!v.paused)go();
});

/* live readout */
const K=k=>R.querySelector(`[data-k="${k}"]`),base={x:549278.428,y:194656.079,z:27.063};
if(!RM) setInterval(()=>{
  for(const k in base)K(k).textContent=(base[k]+(Math.random()-.5)*.012).toFixed(3);
  K('h').textContent=(0.012+Math.random()*.008).toFixed(3);K('v').textContent=(0.024+Math.random()*.01).toFixed(3);
  K('g').textContent=15+Math.round(Math.random()*3);
},900);

/* parallax readouts + magnetic buttons */
const outs=[...R.querySelectorAll('.readout')];
const ret=$('.reticle'),rtag=ret.querySelector('.tag'),rh=ret.querySelector('.h'),rv=ret.querySelector('.v');
R.addEventListener('pointermove',e=>{const r=R.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  rh.style.top=y+'px';rv.style.left=x+'px';rtag.style.left=x+'px';rtag.style.top=y+'px';
  rtag.textContent=`X ${(549300-y*.05).toFixed(3)}  Y ${(194600+x*.05).toFixed(3)}`;});
if(!RM) R.addEventListener('pointermove',e=>{const r=R.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width-.5,ny=(e.clientY-r.top)/r.height-.5;
  outs.forEach(o=>{const d=+o.dataset.depth;o.style.transform=`translate(${nx*d}px,${ny*d}px)`})});
if(!RM&&matchMedia('(hover:hover)').matches) R.querySelectorAll('.mag').forEach(b=>{
  b.addEventListener('pointermove',e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.18}px,${(e.clientY-r.top-r.height/2)*.28}px)`});
  b.addEventListener('pointerleave',()=>b.style.transform='');
});

/* ---------- survey-map background (지도 느낌): 좌표 격자 · 지적 필지 · 도로 + 천천히 흐르는 지도 · 밝아졌다 사라지는 구역 · 흐르는 도로 중앙선 · 측점 펄스 ---------- */
const cv=$('#st26m-topo'),cx=cv.getContext('2d'),INK='120,190,240',AMP=1.25;
let W,H,DPR,t=0,vis=true,mapImg,PAD=160,roads=[],marks=[];
const C=a=>`rgba(${INK},${Math.min(1,a*AMP).toFixed(3)})`;
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function build(){
  const r=rnd(20261),BW=W+PAD*2,BH=H+PAD*2;
  mapImg=document.createElement('canvas');mapImg.width=BW*DPR;mapImg.height=BH*DPR;
  const g=mapImg.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);g.lineCap='round';g.lineJoin='round';
  /* coordinate grid + crosses */
  g.lineWidth=1;g.strokeStyle=C(.045);g.beginPath();
  for(let x=0;x<BW;x+=120){g.moveTo(x+.5,0);g.lineTo(x+.5,BH)}for(let y=0;y<BH;y+=120){g.moveTo(0,y+.5);g.lineTo(BW,y+.5)}g.stroke();
  g.strokeStyle=C(.16);g.beginPath();
  for(let x=0;x<BW;x+=120)for(let y=0;y<BH;y+=120){g.moveTo(x-5,y+.5);g.lineTo(x+5,y+.5);g.moveTo(x+.5,y-5);g.lineTo(x+.5,y+5)}g.stroke();
  /* cadastral parcels: rows of lots in a slightly rotated frame, a few lots shaded like buildings */
  g.save();g.translate(BW/2,BH/2);g.rotate(-.3);const RR=Math.hypot(BW,BH)/2+80,lots=[];
  g.beginPath();
  for(let y=-RR;y<RR;){const h=46+r()*42;g.moveTo(-RR,y);g.lineTo(RR,y);
    for(let x=-RR+r()*50;x<RR;){const w=26+r()*64,k=(r()-.5)*12;g.moveTo(x,y);g.lineTo(x+k,y+h);if(r()<.13)lots.push([x+4,y+4,w-8,h-8]);x+=w}
    y+=h}
  g.lineWidth=.8;g.strokeStyle=C(.11);g.stroke();
  g.fillStyle=C(.05);lots.forEach(l=>g.fillRect(...l));
  g.restore();
  /* roads: cut the lots, then draw kerb lines and a dashed centre line */
  roads=[[-20,BH*.66, BW*.3,BH*.5, BW*.62,BH*.62, BW+20,BH*.3],
         [BW*.58,-20, BW*.66,BH*.35, BW*.56,BH*.7, BW*.74,BH+20],
         [BW*.05,-20, BW*.2,BH*.3, BW*.08,BH*.6, BW*.3,BH+20]];
  const path=r=>{g.beginPath();g.moveTo(r[0],r[1]);g.bezierCurveTo(r[2],r[3],r[4],r[5],r[6],r[7])};
  roads.forEach((rd,i)=>{const w=i===0?20:14;
    const cut=lw=>{g.globalCompositeOperation='destination-out';g.strokeStyle='#000';path(rd);g.lineWidth=lw;g.stroke();g.globalCompositeOperation='source-over'};
    cut(w+2);path(rd);g.lineWidth=w+2;g.strokeStyle=C(.2);g.stroke();     /* kerb lines */
    cut(w);path(rd);g.lineWidth=w;g.strokeStyle=C(.07);g.stroke();});      /* road surface (centre line is drawn live) */
  /* survey control points (pulsing) */
  marks=[];for(let i=0;i<16;i++)marks.push([PAD*.5+r()*(BW-PAD),PAD*.5+r()*(BH-PAD),r()*6.28]);
}
const mkc=document.createElement('canvas'),mk=mkc.getContext('2d');
function size(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);mkc.width=W;mkc.height=H;build()}
function draw(){
  cx.clearRect(0,0,W,H);
  /* the map pans and zooms in and out, so its lines keep sliding and growing across the background */
  const ox=-PAD+Math.sin(t*.23)*PAD*.85,oy=-PAD+Math.cos(t*.17)*PAD*.7,sc=1.14+.16*Math.sin(t*.15);
  const fx=W*.62,fy=H*.5;
  cx.save();cx.translate(fx,fy);cx.scale(sc,sc);cx.translate(-fx+ox,-fy+oy);
  cx.drawImage(mapImg,0,0,mapImg.width/DPR,mapImg.height/DPR);
  cx.lineWidth=1;cx.setLineDash([7,9]);cx.lineDashOffset=-t*60;cx.strokeStyle=C(.2);
  roads.forEach(r=>{cx.beginPath();cx.moveTo(r[0],r[1]);cx.bezierCurveTo(r[2],r[3],r[4],r[5],r[6],r[7]);cx.stroke()});
  cx.setLineDash([]);
  marks.forEach(([x,y,p])=>{
    cx.strokeStyle=C(.3);cx.lineWidth=1.2;cx.beginPath();cx.moveTo(x,y-5);cx.lineTo(x+4.5,y+3);cx.lineTo(x-4.5,y+3);cx.closePath();cx.stroke();
    const k=((t*.35+p)%6.28)/6.28;if(k<.35){const q=k/.35;cx.strokeStyle=C(.28*(1-q));cx.beginPath();cx.arc(x,y,6+q*26,0,6.28);cx.stroke()}});
  cx.restore();
  /* drifting light patches: parts of the map brighten and fade as they pass */
  mk.clearRect(0,0,W,H);mk.globalCompositeOperation='source-over';mk.fillStyle='rgba(0,0,0,.3)';mk.fillRect(0,0,W,H);mk.globalCompositeOperation='lighter';
  for(let i=0;i<4;i++){const x=W*(.5+.42*Math.sin(t*(.21+i*.07)+i*1.9)),y=H*(.5+.4*Math.cos(t*(.17+i*.05)+i*2.7)),rr=Math.max(W,H)*(.26+.06*i);
    const gr=mk.createRadialGradient(x,y,0,x,y,rr);gr.addColorStop(0,'rgba(0,0,0,.7)');gr.addColorStop(1,'rgba(0,0,0,0)');mk.fillStyle=gr;mk.fillRect(0,0,W,H)}
  cx.globalCompositeOperation='destination-in';cx.drawImage(mkc,0,0,W,H);cx.globalCompositeOperation='source-over';
  /* fade everything out behind the text column */
  const m=cx.createLinearGradient(0,0,W,0);m.addColorStop(0,'rgba(0,0,0,.25)');m.addColorStop(.45,'rgba(0,0,0,.6)');m.addColorStop(1,'rgba(0,0,0,1)');
  cx.globalCompositeOperation='destination-in';cx.fillStyle=m;cx.fillRect(0,0,W,H);cx.globalCompositeOperation='source-over';
}
function loop(){if(vis){t+=.006;draw()}requestAnimationFrame(loop)}
size();draw();addEventListener('resize',()=>{size();draw()});
new IntersectionObserver(es=>vis=es[0].isIntersecting).observe(R);
if(!RM) requestAnimationFrame(loop);
})();
</script>
